name: Publish weekly essay

# Merges the week's essay pull request at 6:00am Sunday, America/Chicago.
# GitHub schedules run in UTC, so this fires twice an hour from 11 to 14 UTC on
# Sundays (6am is 11 UTC in summer and 12 UTC in winter; the later tries are
# backups). The minutes are off the top of the hour because GitHub often skips
# scheduled runs at :00. The script checks Chicago time and publishes at most once.
# See .github/scripts/publish-essays.mjs for exactly what gets merged.

on:
  schedule:
    - cron: '17,47 11-14 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be published'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/scripts/publish-essays.mjs'
      - '.github/workflows/publish-weekly-essay.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-weekly-essay
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish due essays
        run: node .github/scripts/publish-essays.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
